# 在极空间 Docker 中部署背题软件（静态站点）
#
# 用法：
# 1. 把本机构建好的 dist/ 目录整个上传到极空间的一个共享文件夹，例如：
#    /共享/beiti/dist   （dist 里面应有 index.html、assets/...、sw.js、manifest.webmanifest）
# 2. 把下面的 volumes 路径改成你极空间上 dist 的真实路径。
# 3. 把 nginx.conf 也放到同一目录（与 docker-compose.yml 平级）。
# 4. 在极空间 Docker 里用「compose 部署 / 导入 compose」选这个文件，或手动跑：
#    docker compose up -d
#
# 注意：nginx:alpine 是多架构镜像，Z2S(ARM) 会自动拉取 ARM 版本。

services:
  beiti:
    image: nginx:alpine
    container_name: beiti
    ports:
      - "8088:80"   # 极空间访问端口 8088 -> 容器内 80
    volumes:
      # 改成你极空间上 dist 的真实绝对路径
      - /共享/beiti/dist:/usr/share/nginx/html:ro
      # 用本项目定制配置覆盖默认配置
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
